[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpnet"
version = "0.4.0"
description = "Canonical training and evaluation code for the TGPNet/PQTNet surface regression model."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "pyyaml",
  "scipy",
  "torch",
  "torchvision",
  "torchsr==1.0.4",
]



[tool.setuptools.packages.find]
include = ["pqt*"]

